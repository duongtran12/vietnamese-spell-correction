seed: 42

split:
  train: 0.8
  validation: 0.1
  test: 0.1

deduplication:
  near_duplicate_threshold: 0.95
  maximum_comparisons: 1000000

noise:
  sentence_error_probability: 0.6
  max_errors_per_sentence: 1
  operations:
    - delete
    - insert
    - substitute
    - transpose
    - diacritic

